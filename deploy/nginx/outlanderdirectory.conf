# /etc/nginx/sites-available/outlanderdirectory  →  symlink into sites-enabled
#
# TWO HOSTNAMES, ONE APP. This file is the whole reason a contributor cannot
# reach OutlanderOS from an invite link.
#
#   outlanderdirectory.com      the contributor surface: the credit pages, the
#                               endpoint they post to, and the assets those
#                               need. Everything else on this hostname is sent
#                               to the magazine's own site.
#
#   os.outlanderdirectory.com   the system: every portal, every API route,
#                               the login screen.
#
# The split is enforced here rather than in the app, and that is deliberate.
# An allowlist in nginx cannot be got round by a new page landing in the wrong
# route group, or by a route that forgets its auth guard: /finance, /admin and
# /api/xero are not "protected" on the public hostname, they are not served on
# it at all. The app never learns which door someone came through.
#
# The session cookie is host-scoped (no Domain attribute — see
# src/lib/auth-cookie.ts), so a staff login on os. is never transmitted to the
# public hostname either.
#
# INSTALL — these blocks listen on :80 only, on purpose. Put them in place
# first, then run certbot, which writes the 443 blocks and the redirects into
# this file itself:
#
#   scp deploy/nginx/outlanderos-proxy.conf root@HOST:/etc/nginx/snippets/
#   scp deploy/nginx/outlanderdirectory.conf root@HOST:/etc/nginx/sites-available/outlanderdirectory
#   ln -s /etc/nginx/sites-available/outlanderdirectory /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d outlanderdirectory.com -d www.outlanderdirectory.com \
#           -d os.outlanderdirectory.com
#
# DNS must resolve all three names to this box before certbot runs — HTTP-01
# validation fetches a file over port 80 on each name in turn.

# ─── Public: the contributor surface ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name outlanderdirectory.com www.outlanderdirectory.com;

    # Contributors submit a form. Nothing here uploads a file, so the 25M this
    # box allows on the staff host has no business being available publicly.
    client_max_body_size 2m;

    # The invite links carry a token that is a credential. Keep the pages, and
    # anything crawlable that references them, out of every index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # One tokenised page per contributor.
    location /credit/ {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }

    # The only API surface this hostname exposes: that page's own endpoint,
    # which authenticates on the token in the URL and returns one person's
    # prefill. Note the trailing slash — /api/credits (the staff route) does
    # not match this prefix.
    location /api/credit/ {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }

    # Next's build output, and the wordmark the page is set in.
    location /_next/ {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }
    location /fonts/ {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }

    # Everything else: not a 404 into a login page, but off to the magazine.
    # Someone who types the domain out of curiosity is a reader, and the
    # honest destination for a reader is the magazine's own site.
    location / {
        return 302 https://outlandermag.com/;
    }
}

# ─── Staff: the whole system ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name os.outlanderdirectory.com;

    # Order-history CSV exports run to several MB. nginx defaults to 1M, which
    # rejects the upload with an HTML 413 the browser then fails to parse as
    # JSON — the error reads as a malformed response rather than a size limit.
    # Above the app's own 20MB cap, so the app returns the friendly error.
    client_max_body_size 25m;

    # An internal tool has no reason to be in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include /etc/nginx/snippets/outlanderos-proxy.conf;
    }
}
