# Shared proxy block — /etc/nginx/snippets/outlanderos-proxy.conf
#
# Included by every location that is allowed to reach the app, so the header
# set can never drift between hostnames. X-Forwarded-Proto is what makes the
# app build https:// links once TLS is on; X-Forwarded-For is what the
# in-memory rate limiter keys on.

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
proxy_read_timeout 86400;
